name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Renders public/ in the runner's preinstalled Chrome and fails on prose past
      # 75 characters a line, under 16px, or justified on a phone.
      - name: Line length and body size (check-measure)
        run: |
          npm ci --prefix tools --ignore-scripts
          node tools/check-measure.mjs public > measure.txt
          cat measure.txt
          [ ! -s measure.txt ]

      - name: css-touch-lint (hover, focus ring, :invalid, Tailwind flag, input size)
        run: python3 scripts/css-touch-lint.py
      - name: gitleaks (secrets in the pushed commits)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact
